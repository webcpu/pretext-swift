name: DemoDeviceRunner
options:
  defaultConfig: Release
  deploymentTarget:
    iOS: "18.0"
schemes:
  DemoDeviceRunner:
    build:
      targets:
        DemoDeviceRunner: all
    run:
      config: Release
      executable: DemoDeviceRunner
    test:
      config: Release
    profile:
      config: Release
      executable: DemoDeviceRunner
    analyze:
      config: Release
    archive:
      config: Release
    management:
      shared: true
targets:
  BenchmarkSupport:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ../../Sources/Benchmark
    dependencies:
      - package: PretextSwift
        product: Pretext
      - package: PretextSwift
        product: PretextUI
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NA5BE2D52P
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.liang.pretextswift.benchmarksupport
        SKIP_INSTALL: YES
  DemoDeviceRunner:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ../../Sources/Demo
      - path: DemoBundleModuleShim.swift
    dependencies:
      - target: BenchmarkSupport
      - package: PretextSwift
        product: Pretext
      - package: PretextSwift
        product: PretextUI
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NA5BE2D52P
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.liang.pretextswift.demodevicerunner
        PRODUCT_NAME: Demo
        INFOPLIST_KEY_CFBundleDisplayName: Demo
        INFOPLIST_KEY_NSCameraUsageDescription: Read your silhouette live so article text can wrap around you.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
packages:
  PretextSwift:
    path: ../..
